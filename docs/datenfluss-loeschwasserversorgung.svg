<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title description">
<title id="title">Datenfluss der Löschwasserversorgung</title>
<desc id="description">Amtliche Geodaten, Kärntner Objektdatenbank und OSM-Gebäude werden über Importskripte zu lokalen Daten und Berichten verarbeitet. Keine OSM-Wasserquellen.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#243349}
.h{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#64748b}
.head{font-size:19px;font-weight:700;fill:white}
.name{font-size:16px;font-weight:700}
.info{font-size:13px;fill:#43546b}
.path{font-family:Consolas,monospace;font-size:12px;fill:#30445b}
.arrow{fill:none;stroke:#2e6aab;stroke-width:3;stroke-linejoin:round}
.source{fill:#e6f2ff;stroke:#3d8ad0;stroke-width:2}
.process{fill:#e7f6e6;stroke:#40a367;stroke-width:2}
.file{fill:#edf1f7;stroke:#8293a7;stroke-width:2}
.analysis{fill:#fff0df;stroke:#ef983e;stroke-width:2}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2e6aab"/></marker></defs>
<rect width="1600" height="950" fill="#fff"/>
<text x="800" y="52" text-anchor="middle" class="h">Datenfluss / Verarbeitungsübersicht – Löschwasserversorgung</text>
<text x="800" y="81" text-anchor="middle" class="sub">Gemeindeanalyse aus amtlichen Geodaten, Kärntner Objektdatenbank und OSM-Gebäuden</text>
<rect x="28" y="115" width="272" height="45" rx="9" fill="#367fc2"/><text x="164" y="144" text-anchor="middle" class="head">Datenquellen</text>
<rect x="323" y="115" width="340" height="45" rx="9" fill="#318c5c"/><text x="493" y="144" text-anchor="middle" class="head">Import / Aufbereitung</text>
<rect x="684" y="115" width="392" height="45" rx="9" fill="#63748a"/><text x="880" y="144" text-anchor="middle" class="head">Zwischenergebnisse</text>
<rect x="1101" y="115" width="474" height="45" rx="9" fill="#ed8a37"/><text x="1338" y="144" text-anchor="middle" class="head">Analysen / Berichte</text>

<!-- source nodes -->
<rect class="source" x="28" y="190" width="272" height="94" rx="10"/><text class="name" x="45" y="220">Statistik Austria</text><text class="info" x="45" y="247">Gemeindegrenzen</text>
<rect class="source" x="28" y="305" width="272" height="94" rx="10"/><text class="name" x="45" y="335">KAGIS</text><text class="info" x="45" y="362">Flächenwidmung / Bauland</text>
<rect class="source" x="28" y="448" width="272" height="116" rx="10"/><text class="name" x="45" y="479">Kärntner Objektdatenbank</text><text class="info" x="45" y="509">GeoJSON, Kategorie 1724</text><text class="info" x="45" y="532">Wasserentnahmestellen</text>
<rect class="source" x="28" y="648" width="272" height="95" rx="10"/><text class="name" x="45" y="680">OpenStreetMap</text><text class="info" x="45" y="711">Gebäudegrundflächen</text>

<!-- imports -->
<rect class="process" x="323" y="229" width="340" height="136" rx="10"/>
<text class="name" x="342" y="255">scripts/import_geodata.py</text>
<text class="info" x="342" y="286">• Gemeindegrenzen importieren</text><text class="info" x="342" y="311">• Widmung importieren</text><text class="info" x="342" y="336">• Bauland ableiten</text>
<rect class="process" x="323" y="448" width="340" height="116" rx="10"/>
<text class="name" x="342" y="477">scripts/import_odb_water_sources.py</text>
<text class="info" x="342" y="508">• Lokalen GeoJSON-Export lesen</text><text class="info" x="342" y="535">• An Gemeindegrenze filtern</text>
<rect class="process" x="323" y="630" width="340" height="128" rx="10"/>
<text class="name" x="342" y="658">scripts/import_osm.py</text>
<text class="info" x="342" y="681">oder</text><text class="name" x="342" y="703">scripts/import_osm_buildings_pbf.py</text>
<text class="info" x="342" y="731">Gebäude aus Overpass / lokalem PBF</text>

<!-- intermediate files -->
<rect class="file" x="684" y="229" width="392" height="136" rx="10"/>
<text class="name" x="701" y="254">data/processed/&lt;GKZ&gt;/</text>
<text class="path" x="701" y="281">boundary.geojson</text><text class="path" x="701" y="305">zoning.geojson · bauland.geojson</text>
<text class="path" x="701" y="329">import_manifest.json</text>
<rect class="file" x="684" y="448" width="392" height="116" rx="10"/>
<text class="name" x="701" y="475">data/processed/&lt;GKZ&gt;/odb_water_sources/</text>
<text class="path" x="701" y="502">odb_water_sources.geojson / .csv</text>
<text class="path" x="701" y="531">odb_water_sources_manifest.json</text>
<rect class="file" x="684" y="630" width="392" height="128" rx="10"/>
<text class="name" x="701" y="660">data/processed/&lt;GKZ&gt;/osm/</text>
<text class="path" x="701" y="690">buildings.geojson</text><text class="path" x="701" y="714">osm_manifest.json</text>

<!-- analysis boxes and outputs -->
<rect class="analysis" x="1101" y="196" width="474" height="96" rx="10"/>
<text class="name" x="1118" y="227">scripts/show_odb_water_sources.py</text><text class="path" x="1118" y="254">reports/&lt;GKZ&gt;/odb_wasserentnahmestellen.html</text><text class="info" x="1118" y="275">Interaktive Offline-Karte</text>
<rect class="analysis" x="1101" y="378" width="474" height="97" rx="10"/>
<text class="name" x="1118" y="409">scripts/analyze_odb_water_sources.py</text><text class="path" x="1118" y="437">reports/&lt;GKZ&gt;/odb_bestandsanalyse.*</text>
<text class="info" x="1118" y="458">Bestandsanalyse (Markdown, CSV, JSON)</text>
<rect class="analysis" x="1101" y="600" width="474" height="100" rx="10"/>
<text class="name" x="1118" y="632">scripts/analyze_buildings_odb_distance.py</text>
<text class="path" x="1118" y="658">reports/&lt;GKZ&gt;/gebaeude_odb_abstaende.*</text>
<text class="info" x="1118" y="682">Abstände aller erfassten Gebäude zur ODB</text>

