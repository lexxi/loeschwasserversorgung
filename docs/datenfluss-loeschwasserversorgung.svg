<rect x="28" y="796" width="755" height="92" rx="12" fill="#e6f5e8" stroke="#9bd1a4"/>
<text x="48" y="825" class="name">Fachliche Projektentscheidung</text>
<text x="48" y="849" class="info">Nur ODB-Wasserentnahmestellen als Löschwasserquellen.</text>
<text x="48" y="871" class="info">Die Archivdaten aus OSM sind nicht Teil dieses Datenflusses.</text>
<rect x="800" y="796" width="775" height="92" rx="12" fill="#edf2f8" stroke="#bdc8d8"/>
<text x="820" y="825" class="name">Geltungsbereich</text>
<text x="820" y="849" class="info">Alle erfassten Gebäude – unabhängig von Widmung und Gebäudetyp.</text>
<text x="820" y="871" class="info">Luftlinienabstände sind kein Leistungs- oder Versorgungsnachweis.</text>
<text x="800" y="922" text-anchor="middle" class="sub">Legende: Blau = Datenquelle · Grün = Verarbeitung · Grau = lokale Daten · Orange = Analyse / Bericht</text>
</svg>