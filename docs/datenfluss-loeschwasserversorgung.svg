<text x="813" y="1060" class="detail">reports/&lt;GKZ&gt;/index.html · reports/glossar.html</text>
<text x="813" y="1083" class="small">Offline nutzbar; private ODB-/Adressdaten nicht öffentlich bereitstellen</text>
<text x="800" y="1125" text-anchor="middle" class="subtitle">Nur ODB als Löschwasserquellenbasis · OSM-Wasserquellen ausgeschlossen · Luftlinien sind kein Versorgungsnachweis</text>
