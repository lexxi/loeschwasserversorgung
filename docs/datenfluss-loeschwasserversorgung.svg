<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Löschwasserversorgung: Datenfluss der Gemeindeanalyse mit BEV, OSM, ODB und ALS</title>
<desc id="chart-desc">Tatsächlicher Datenfluss des Projekts für Malta 20619: fünf GIS-Datenstränge mit Quellsystem, Importskript, lokalem Datensatz und Ergebnis. Gemeinde- und KAGIS-Daten; OSM-Gebäude und Straßen; BEV-Adressen und Gebäudegeometrien; BEV-Laserscan-Höhendaten; lokale Kärntner ODB-Wasserentnahmestellen. 25 ungeklärte BEV-OSM-Fälle gehen als CSV an die Gemeinde; 16 Toleranzfälle sind vorläufig. Alle Ausgaben sind Bestandsinventur, kein Löschwassernachweis.</desc>
