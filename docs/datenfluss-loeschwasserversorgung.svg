<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title description">
<title id="title">Datenfluss Löschwasserversorgung – aktuelle GIS-Pipeline mit BEV-Adresszuordnung</title>
<desc id="description">Datenquellen Statistik Austria, KAGIS, OSM, BEV Adressregister, BEV ALS und Kärntner ODB werden lokal importiert und analysiert. Geometrische BEV-OSM-Fälle gehen als Rückfrageliste an die Gemeinde; Glossar und Berichtsindex führen die Offline-Berichte zusammen. Kein rechtlicher Löschwassernachweis.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#243349}
.title{font-size:29px;font-weight:700}.subtitle{font-size:16px;fill:#617185}
.head{font-size:18px;fill:#fff;font-weight:700}
.name{font-size:17px;font-weight:700}.detail{font-size:14px;fill:#43546b}
.small{font-size:13px;fill:#476177}.mono{font-family:Consolas,monospace;font-size:13px;fill:#243d57}
.src{fill:#e7f2ff;stroke:#3e85be;stroke-width:2}
.proc{fill:#e9f6e9;stroke:#419565;stroke-width:2}
.dat{fill:#f0f3f8;stroke:#8499ae;stroke-width:2}
.out{fill:#fff2e5;stroke:#d88b3e;stroke-width:2}
.line{fill:none;stroke:#68819b;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.flag{fill:#fff5e4;stroke:#daa44d;stroke-width:1.5}
</style>
