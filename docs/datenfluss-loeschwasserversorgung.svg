<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title description">
<title id="title">Datenfluss der Löschwasserversorgung</title>
<desc id="description">Amtliche Geodaten, Kärntner Objektdatenbank und OSM-Gebäude werden über Importskripte zu lokalen Daten und Berichten verarbeitet. Keine OSM-Wasserquellen.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#243349}
.h{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#64748b}
.head{font-size:19px;font-weight:700;fill:white}
.name{font-size:16px;font-weight:700}
.info{font-size:13px;fill:#43546b}
.path{font-family:Consolas,monospace;font-size:12px;fill:#30445b}
.arrow{fill:none;stroke:#2e6aab;stroke-width:3;stroke-linejoin:round}
.source{fill:#e6f2ff;stroke:#3d8ad0;stroke-width:2}
.process{fill:#e7f6e6;stroke:#40a367;stroke-width:2}
.file{fill:#edf1f7;stroke:#8293a7;stroke-width:2}
.analysis{fill:#fff0df;stroke:#ef983e;stroke-width:2}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2e6aab"/></marker>
<!-- Self-contained vector symbols: no fonts or external image URLs -->
<symbol id="symbol-austria" viewBox="0 0 64 48">
  <path d="M6 22 13 17 18 20 23 11 29 14 34 8 41 14 47 10 52 17 59 18 55 26 61 30 51 35 45 33 38 40 31 37 26 42 18 36 12 37 9 29 3 27Z"
        fill="#fff" stroke="#326caa" stroke-width="2" stroke-linejoin="round"/>
  <path d="M12 24 55 24 M14 30 48 30" stroke="#df5151" stroke-width="3" opacity=".8"/>
</symbol>
